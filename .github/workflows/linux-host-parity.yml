name: Linux ARM64 and x64 host parity

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Host and runner tests
        run: |
          (cd host && go test ./...)
          node --test runner/service.test.mjs runner/sdk_install.test.mjs
          bash -n scripts/install-linux.sh scripts/uninstall-linux.sh
      - name: Wrong-architecture selection fails before package changes
        run: |
          if MAIN_CONTROLLER_URL=https://example.com MAIN_EXPECTED_ARCH=arm64 bash scripts/install-linux.sh; then
            echo 'ARM64 installer selection should fail on Linux x64' >&2
            exit 1
          fi
      - name: Build Linux x64 and ARM64 hosts
        run: |
          (cd host && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/maincreate-host-linux-amd64 .)
          (cd host && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/maincreate-host-linux-arm64 .)
          test "$(cat targets/linux/amd64/VERSION)" = "$(/tmp/maincreate-host-linux-amd64 version)"
          test "$(cat targets/linux/arm64/VERSION)" = "$(cat targets/linux/amd64/VERSION)"
          file /tmp/maincreate-host-linux-amd64 /tmp/maincreate-host-linux-arm64
